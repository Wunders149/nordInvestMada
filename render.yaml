services:
  - type: web
    name: nord-invest-mada
    runtime: node
    repo: https://github.com/your-username/orinvestmada
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVarGroups:
      - name: app-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SITE_URL
        value: https://nord-invest-mada.onrender.com
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Nord Invest Madagascar <contact@nordinvestmada.com>"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_EMAIL
        value: contact@nordinvestmada.com,nordinvestmadagascar@gmail.com
      - key: GOOGLE_ANALYTICS_ID
        sync: false
